<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entrar no InsureAlert — Sistema inteligente de comunicação proativa com segurados.">
    <title>Entrar — InsureAlert</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('insureAlert_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="/static/css/styles.css?v=3.0">
    <link rel="stylesheet" href="/static/css/auth.css?v=3.0">
</head>
<body class="auth-body">
    <!-- Redirect if already logged in -->
    <script>
        (function() {
            const session = localStorage.getItem('insureAlert_session');
            if (session) window.location.href = '/dashboard';
        })();
    </script>

    <div class="auth-bg-effects">
        <div class="auth-orb auth-orb-1"></div>
        <div class="auth-orb auth-orb-2"></div>
        <div class="auth-orb auth-orb-3"></div>
    </div>

    <!-- Centered standard authentication layout -->
    <div class="auth-centered-container">
        
        <!-- Top bar with Back button and Theme toggle -->
        <div class="auth-top-bar">
            <a href="/" class="auth-back-link" title="Voltar para a página inicial">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                <span>Voltar ao início</span>
            </a>

            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" type="button" title="Alternar entre tema Claro e Escuro" aria-label="Alternar tema">
                <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <span class="theme-toggle-text">Tema</span>
            </button>
        </div>

        <!-- Standard Login Card -->
        <div class="auth-standard-card">
            <div class="auth-card-logo-wrap">
                <div class="auth-logo-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1>InsureAlert</h1>
                <p>Acesse o painel com suas credenciais</p>
            </div>

            <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
                <!-- Error/Success message alert -->
                <div class="auth-message" id="authMessage"></div>

                <!-- Email field -->
                <div class="form-group">
                    <label for="email" class="form-label">E-mail corporativo ou de acesso</label>
                    <div class="form-input-wrapper">
                        <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <input type="email" id="email" name="email" class="form-input" placeholder="admin@insure.com" required autocomplete="email" autofocus>
                    </div>
                </div>

                <!-- Password field -->
                <div class="form-group">
                    <div class="form-label-row">
                        <label for="password" class="form-label">Senha de acesso</label>
                        <a href="#" class="form-link" onclick="event.preventDefault(); alert('Para redefinir sua senha, entre em contato com o suporte ou use a conta de teste.');">Esqueceu a senha?</a>
                    </div>
                    <div class="form-input-wrapper">
                        <svg class="form-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0110 0v4"/>
                        </svg>
                        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="current-password">
                        <button type="button" class="form-input-toggle" onclick="togglePassword('password', this)" aria-label="Mostrar senha">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember me -->
                <div class="form-group-inline">
                    <label class="form-checkbox">
                        <input type="checkbox" id="remember" name="remember" checked>
                        <span class="checkmark"></span>
                        Lembrar meu acesso
                    </label>
                </div>

                <!-- Submit button -->
                <button type="submit" class="auth-btn" id="loginBtn">
                    <span class="auth-btn-text">
                        Acessar Plataforma
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="margin-left: 6px;">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </span>
                    <span class="auth-btn-loader" style="display:none">
                        <span class="spinner"></span>
                        Autenticando...
                    </span>
                </button>
            </form>

            <!-- 1-Click Quick Demo Credentials Pill -->
            <div class="auth-quick-demo" id="demoFillBox" onclick="fillDemoCredentials()" title="Clique para preencher as credenciais de teste automaticamente">
                <div class="auth-quick-demo-info">
                    <strong>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                        Acesso Rápido de Teste (Demo)
                    </strong>
                    <span>admin@insure.com • admin123</span>
                </div>
                <button type="button" class="auth-quick-demo-btn">Preencher</button>
            </div>

            <!-- Footer text -->
            <div class="auth-footer-text">
                Não tem uma conta? <a href="/register" class="auth-footer-link">Cadastrar nova conta</a>
            </div>
        </div>

        <!-- Security footer -->
        <div class="auth-security-footer">
            <div class="auth-security-pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0110 0v4"/>
                </svg>
                Ambiente seguro com criptografia e autenticação JWT
            </div>
            <span>InsureAlert © 2026 • Desafio 5</span>
        </div>

    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('insureAlert_theme', next);
            updateThemeBtn(next);
        }

        function updateThemeBtn(theme) {
            const btn = document.getElementById('themeToggleBtn');
            if (!btn) return;
            const text = btn.querySelector('.theme-toggle-text');
            if (theme === 'light') {
                btn.setAttribute('title', 'Mudar para Tema Escuro');
                if (text) text.textContent = 'Claro';
            } else {
                btn.setAttribute('title', 'Mudar para Tema Claro');
                if (text) text.textContent = 'Escuro';
            }
        }

        // Initialize button label
        (function() {
            const theme = document.documentElement.getAttribute('data-theme') || 'dark';
            updateThemeBtn(theme);
        })();

        // 1-Click quick fill demo credentials
        function fillDemoCredentials() {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            if (emailInput && passwordInput) {
                emailInput.value = 'admin@insure.com';
                passwordInput.value = 'admin123';
                emailInput.focus();
                
                const demoBox = document.getElementById('demoFillBox');
                if (demoBox) {
                    demoBox.style.transform = 'scale(0.97)';
                    setTimeout(() => { demoBox.style.transform = ''; }, 160);
                }
            }
        }
    </script>
</body>
</html>
