services:
  - type: web
    name: insurealert-insurminds
    env: python
    plan: free
    rootDir: Desafio_5
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
